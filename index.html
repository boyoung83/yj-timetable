<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5EAEE0">
<title>유정이 2학기 시간표</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 폰트는 렌더링을 막지 않게 비동기 로드.
     (동기 로드 시 폰트 서버가 응답 없으면 뒤따르는 인라인 script가 실행되지 않아 시간표가 통째로 안 보임) -->
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --bg:#F2F8FC; --card:#FFFFFF; --ink:#274257; --sub:#7A8CA0;
  --sky1:#6FBBE8; --sky2:#4E9BD8; --sun:#FFD66B; --line:#E3EDF5;
  --now:#FF6B57;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg); color:var(--ink);
  min-height:100vh; padding-bottom:32px;
}
.jua{font-family:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}

/* ---------- header ---------- */
header{
  background:linear-gradient(150deg,var(--sky1),var(--sky2));
  color:#fff; padding:18px 18px 54px; border-radius:0 0 26px 26px;
  position:relative; overflow:hidden;
}
header .sun{
  position:absolute; right:-22px; top:-22px; width:110px; height:110px; border-radius:50%;
  background:radial-gradient(circle at 40% 40%, #FFE49A, var(--sun) 60%, rgba(255,214,107,.0) 72%);
  opacity:.9;
}
header .tigger{
  position:absolute; right:8px; top:44px; width:94px; height:auto;
  animation:bob 3.2s ease-in-out infinite;
}
@keyframes bob{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(5px) rotate(2deg)}
}
@media (prefers-reduced-motion: reduce){ header .tigger{animation:none} }
header h1{font-family:'Jua'; font-size:24px; font-weight:400; letter-spacing:.5px}
header .range{font-size:12.5px; opacity:.92; margin-top:4px}
header .todaypill{
  display:inline-block; margin-top:10px; background:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.45); border-radius:999px; padding:4px 12px;
  font-size:13px; font-weight:500;
}

/* ---------- tabs ---------- */
.tabs{
  display:flex; gap:6px; background:var(--card); border-radius:16px; padding:5px;
  margin:-32px 16px 0; box-shadow:0 6px 18px rgba(46,107,160,.14); position:relative; z-index:2;
}
.tabs button{
  flex:1; border:0; background:transparent; font-family:'Jua'; font-size:16px; color:var(--sub);
  padding:10px 0; border-radius:12px; cursor:pointer; transition:.15s;
}
.tabs button.on{background:linear-gradient(150deg,var(--sky1),var(--sky2)); color:#fff}

main{padding:18px 16px 0; max-width:560px; margin:0 auto}

/* ---------- day / week nav ---------- */
.daynav{display:flex; align-items:center; gap:8px; margin-bottom:4px}
.daynav .arrow{
  width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:var(--card);
  font-size:16px; color:var(--ink); cursor:pointer; flex:none;
}
.daynav .mid{flex:1; text-align:center; min-width:0}
.daynav .mid .d{font-family:'Jua'; font-size:19px}
.daynav .mid .w{font-size:12px; color:var(--sub); margin-top:1px}
.daynav .todaybtn{
  flex:none; border:0; background:var(--sun); color:#7A5A00; font-family:'Jua'; font-size:13px;
  border-radius:12px; padding:0 12px; height:38px; cursor:pointer;
}
.daynav .todaybtn:disabled{opacity:.35}

/* ---------- today timeline ---------- */
.tl{margin-top:14px; position:relative; padding-left:24px}
.tl::before{content:''; position:absolute; left:8px; top:8px; bottom:8px; width:3px; border-radius:3px; background:var(--line)}
.ev{position:relative; margin-bottom:10px}
.ev::before{
  content:''; position:absolute; left:-22px; top:18px; width:11px; height:11px; border-radius:50%;
  background:#C6D8E8; border:2.5px solid var(--bg);
}
.ev .card{
  background:var(--card); border-radius:16px; padding:12px 14px;
  box-shadow:0 2px 8px rgba(46,107,160,.07); display:flex; align-items:center; gap:12px;
  border:1.5px solid transparent;
}
.ev .chip{
  flex:none; width:52px; text-align:center; border-radius:10px; padding:7px 2px;
  font-family:'Jua'; font-size:13px; line-height:1.15;
}
.ev .info{flex:1; min-width:0}
.ev .name{font-weight:700; font-size:15.5px}
.ev .name .tag{
  font-family:'Jua'; font-weight:400; font-size:11px; color:var(--sub); background:var(--line);
  border-radius:6px; padding:1px 6px; margin-left:6px; vertical-align:2px;
}
.ev .time{font-size:13px; color:var(--sub); margin-top:2px}
.ev .st{flex:none; font-size:12px; font-weight:700; color:var(--sub)}
.ev.done .card{opacity:.5}
.ev.done::before{background:#DDE7EF}
.ev.now::before{background:var(--now); box-shadow:0 0 0 4px rgba(255,107,87,.18); animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(255,107,87,.18)}50%{box-shadow:0 0 0 7px rgba(255,107,87,.08)}}
.ev.now .card{border-color:var(--now); box-shadow:0 6px 18px rgba(255,107,87,.18)}
.ev.now .st{color:var(--now)}
.ev.next .card{border-color:var(--sky1)}
.ev.next .st{color:var(--sky2)}
.bar{height:5px; border-radius:5px; background:#F0E4E1; margin-top:8px; overflow:hidden; position:relative}
.bar i{position:absolute; left:0; top:0; bottom:0; background:var(--now); border-radius:5px}
.bar .sunmk{position:absolute; top:-7px; font-size:12px; transform:translateX(-6px)}

.msgcard{
  background:var(--card); border-radius:20px; padding:34px 20px; text-align:center;
  box-shadow:0 2px 10px rgba(46,107,160,.08); margin-top:14px;
}
.msgcard .big{font-size:44px}
.msgcard .t{font-family:'Jua'; font-size:19px; margin-top:10px}
.msgcard .s{font-size:13.5px; color:var(--sub); margin-top:6px; line-height:1.5}

/* ---------- week view ---------- */
.grid{
  background:var(--card); border-radius:18px; box-shadow:0 2px 10px rgba(46,107,160,.08);
  padding:10px 8px 14px 0; overflow:hidden; margin-top:12px;
}
.ghead{display:grid; grid-template-columns:34px repeat(5,1fr); gap:3px; margin-bottom:6px}
.ghead .dh{
  text-align:center; font-family:'Jua'; font-size:13px; color:var(--sub); padding:6px 0 4px; border-radius:10px;
  line-height:1.2;
}
.ghead .dh small{display:block; font-family:'Noto Sans KR'; font-size:10px; font-weight:500}
.ghead .dh.today{background:var(--sun); color:#7A5A00}
.gbody{display:grid; grid-template-columns:34px repeat(5,1fr); gap:3px; position:relative}
.gtime{position:relative}
.gtime span{
  position:absolute; right:5px; transform:translateY(-6px);
  font-size:9.5px; color:#A9B9C8; font-variant-numeric:tabular-nums;
}
.gcol{position:relative; background:#F7FAFD; border-radius:10px}
.gcol .hline{position:absolute; left:0; right:0; height:1px; background:#EAF1F7}
.blk{
  position:absolute; left:1px; right:1px; border-radius:7px; padding:3px 3px 2px;
  overflow:hidden; line-height:1.15; text-align:center;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.9);
}
.blk .bn{font-family:'Jua'; font-size:10.5px; letter-spacing:-.3px;
  white-space:nowrap; overflow:hidden; text-overflow:clip}
.blk .bt{font-size:8.5px; opacity:.8; letter-spacing:-.3px; font-variant-numeric:tabular-nums}
.blk.clip{border-radius:0 0 7px 7px; border-top:2px dashed rgba(47,109,181,.35)}
.blk.lane0{right:50%}
.blk.lane1{left:50%}
.holcol{
  position:absolute; inset:0; border-radius:10px; background:repeating-linear-gradient(
    -45deg,#E9F6EC,#E9F6EC 8px,#DFF1E3 8px,#DFF1E3 16px);
  display:flex; align-items:center; justify-content:center;
}
.holcol span{
  writing-mode:vertical-rl; font-family:'Jua'; font-size:13px; color:#3F8A52; letter-spacing:2px;
}
.holcol.pre{background:repeating-linear-gradient(-45deg,#FFF4DE,#FFF4DE 8px,#FFEAC4 8px,#FFEAC4 16px)}
.holcol.pre span{color:#B0802E}
.nowline{position:absolute; left:34px; right:0; height:2px; background:var(--now); z-index:5; border-radius:2px}
.nowline::before{content:'☀️'; position:absolute; left:-16px; top:-8px; font-size:11px}
.note{font-size:11.5px; color:var(--sub); margin:10px 4px 0; line-height:1.7}
footer{text-align:center; font-size:11px; color:#A9B9C8; margin-top:26px}
.hidden{display:none}
</style>
</head>
<body>

<header>
  <div class="sun"></div>
  <svg class="tigger" viewBox="0 0 140 130" aria-hidden="true">
    <!-- 바닥 그림자 -->
    <ellipse cx="70" cy="121" rx="42" ry="7" fill="#FFFFFF" opacity=".26"/>
    <!-- 꼬리 (가방 뒤) -->
    <path d="M104 100 q18 -2 16 -15 q-2 -11 -14 -9" stroke="#F0922B" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <path d="M115 94 l6 -3 M118 84 l5 -4" stroke="#8A4B1F" stroke-width="3" stroke-linecap="round"/>
    <!-- 책가방 (몸통 뒤) -->
    <rect x="44" y="74" width="52" height="45" rx="14" fill="#E2574C"/>
    <rect x="44" y="98" width="52" height="8" fill="#C9463C"/>
    <rect x="61" y="103" width="18" height="12" rx="4" fill="#FFCF7E"/>
    <rect x="66" y="107" width="8" height="4" rx="2" fill="#D89A3A"/>
    <!-- 몸통 -->
    <ellipse cx="70" cy="88" rx="17" ry="14" fill="#F49B33"/>
    <!-- 어깨끈 -->
    <path d="M57 76 q-3 12 1 21" stroke="#F0776B" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <path d="M83 76 q3 12 -1 21" stroke="#F0776B" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <!-- 귀 -->
    <circle cx="50" cy="32" r="9" fill="#F49B33"/><circle cx="50" cy="32" r="4.5" fill="#FFDFAF"/>
    <circle cx="90" cy="32" r="9" fill="#F49B33"/><circle cx="90" cy="32" r="4.5" fill="#FFDFAF"/>
    <!-- 얼굴 -->
    <circle cx="70" cy="52" r="25" fill="#F49B33"/>
    <ellipse cx="70" cy="61" rx="15" ry="11" fill="#FFE9C7"/>
    <!-- 줄무늬 -->
    <path d="M62 29 l3 7 M70 27 l0 7 M78 29 l-3 7" stroke="#8A4B1F" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M45 44 l8 3 M44 52 l8 1" stroke="#8A4B1F" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M95 44 l-8 3 M96 52 l-8 1" stroke="#8A4B1F" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 눈코입 -->
    <ellipse cx="61" cy="49" rx="4.5" ry="5.5" fill="#FFFFFF"/>
    <ellipse cx="79" cy="49" rx="4.5" ry="5.5" fill="#FFFFFF"/>
    <circle cx="62" cy="50" r="2.3" fill="#2E1A0E"/><circle cx="78" cy="50" r="2.3" fill="#2E1A0E"/>
    <circle cx="63" cy="48.6" r=".9" fill="#FFFFFF"/><circle cx="79" cy="48.6" r=".9" fill="#FFFFFF"/>
    <ellipse cx="70" cy="58" rx="4" ry="2.8" fill="#B0413E"/>
    <path d="M64 63 q6 5 12 0" stroke="#8A4B1F" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="55" cy="60" r="3" fill="#FFB27D" opacity=".7"/><circle cx="85" cy="60" r="3" fill="#FFB27D" opacity=".7"/>
    <!-- 팔 -->
    <path d="M53 74 q-13 13 -8 25" stroke="#F49B33" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M87 74 q13 13 8 25" stroke="#F49B33" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M45 86 l7 2 M95 86 l-7 2" stroke="#8A4B1F" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <h1>유정이 2학기 시간표 🎒</h1>
  <div class="range">4학년 2학기 · 8/25(화) 개학 · 매주 반복</div>
  <div class="todaypill" id="headToday"></div>
</header>

<div class="tabs">
  <button id="tabToday" class="on">오늘</button>
  <button id="tabWeek">주간</button>
</div>

<main>
  <!-- 오늘 -->
  <section id="viewToday">
    <div class="daynav">
      <button class="arrow" id="prevDay">◀</button>
      <div class="mid">
        <div class="d jua" id="dayTitle"></div>
        <div class="w" id="dayWeekLabel"></div>
      </div>
      <button class="arrow" id="nextDay">▶</button>
      <button class="todaybtn" id="goToday">오늘</button>
    </div>
    <div id="dayBody"></div>
  </section>

  <!-- 주간 -->
  <section id="viewWeek" class="hidden">
    <div class="daynav">
      <button class="arrow" id="prevWeek">◀</button>
      <div class="mid">
        <div class="d jua" id="weekTitle"></div>
        <div class="w" id="weekSub"></div>
      </div>
      <button class="arrow" id="nextWeek">▶</button>
      <button class="todaybtn" id="goThisWeek">이번주</button>
    </div>
    <div class="grid">
      <div class="ghead" id="gridHead"></div>
      <div class="gbody" id="gridBody"></div>
    </div>
    <div class="note" id="weekNote"></div>
  </section>

  <footer>우리집 앱 · 유정이 2학기 시간표</footer>
</main>

<script>
// ---------- 시간 도우미 ----------
const T = s => { const [h,m]=s.split(':').map(Number); return h*60+m; };
const fmt = min => {
  let h=Math.floor(min/60), m=min%60;
  if(h>12) h-=12;
  return h+':'+String(m).padStart(2,'0');
};

// ---------- 분류 색 ----------
const C = {
  school:{bg:'#FFFFFF', fg:'#2F6DB5', bd:'#BFDCF5'},
  spec:  {bg:'#FFF3C4', fg:'#8A6D1A'},
  after: {bg:'#FFE0A6', fg:'#8A5A16'},
  lunch: {bg:'#EFF1F3', fg:'#8A929A'},
  math:  {bg:'#1F5F8B', fg:'#FFFFFF'},
  tkd:   {bg:'#D45FC4', fg:'#FFFFFF'},
  readin:{bg:'#FCE0DA', fg:'#B4573F'},
  piano: {bg:'#8CCB74', fg:'#2C5E20'},
  eng:   {bg:'#C8EDC0', fg:'#2F7A38'},
  care:  {bg:'#F08A3C', fg:'#FFFFFF'},
  swim:  {bg:'#CFE7F8', fg:'#1F7FB5'},
};
// n:이름, c:분류, s~e:시간, d:작은 설명(선택)
const ev = (n,c,s,e,d) => ({n, c, s:T(s), e:T(e), d});

// ---------- 2학기 정규 시간표 (월~금 매주 반복) ----------
// 시간표가 바뀌는 시기가 있어서 '언제부터' 적용되는지와 함께 관리해요.
// 새 시간표가 생기면 아래 SCHEDULES 에 {from, label, week, notes} 한 벌을 추가하면 됩니다.

// 8/25 개학 ~ : 태권도 월·수·목 저녁 7시 / 리드인 월·화·금 2:30 / 수학 수 2:30·화목 3:30
const WEEK_SEM = [
  // 월요일
  [ ev('학교','school','9:00','13:30','5교시'),
    ev('리드인','readin','14:30','15:30'),
    ev('영어학원','eng','15:40','17:50'),
    ev('돌봄','care','18:00','19:00'),
    ev('태권도','tkd','19:00','19:50') ],
  // 화요일
  [ ev('학교','school','9:00','13:30','5교시'),
    ev('리드인','readin','14:30','15:30'),
    ev('수학','math','15:30','16:30'),
    ev('피아노','piano','16:30','17:30'),
    ev('돌봄','care','17:30','19:30'),
    ev('수영학원','swim','19:30','21:10') ],
  // 수요일
  [ ev('학교','school','9:00','13:30','5교시'),
    ev('수학','math','14:30','15:30'),
    ev('영어학원','eng','15:40','17:50'),
    ev('돌봄','care','18:00','19:00'),
    ev('태권도','tkd','19:00','19:50') ],
  // 목요일
  [ ev('학교','school','9:00','14:20','6교시'),
    ev('수학','math','15:30','16:30'),
    ev('피아노','piano','16:30','17:30'),
    ev('돌봄','care','17:30','19:00'),
    ev('태권도','tkd','19:00','19:50') ],
  // 금요일
  [ ev('학교','school','9:00','13:30','5교시'),
    ev('리드인','readin','14:30','15:30'),
    ev('영어학원','eng','15:40','17:50'),
    ev('돌봄','care','18:00','19:00') ],
];

const SCHOOL_NOTE = '🏫 학교: 월·화·수·금 5교시(~1:30) / 목 6교시(~2:20)';
const CARE_NOTE   = '🧡 돌봄: 월·수·금 6:00~7:00 / 화 5:30~7:30 / 목 5:30~7:00';

// from(그날 포함)부터 다음 시간표가 시작될 때까지 적용.
// 시간표가 또 바뀌면 {from, label, week, notes} 한 벌을 아래에 추가하면 돼요.
const SCHEDULES = [
  { from:new Date(2026,7,25), label:'2학기', week:WEEK_SEM, notes:[
      SCHOOL_NOTE,
      '🥋 태권도: 월·수·목 저녁 7:00~7:50',
      '📖 리드인: 월·화·금 2:30~3:30',
      '📘 수학: 수 2:30~3:30 / 화·목 3:30~4:30 · 🏊 수영: 화 7:30~9:10',
      CARE_NOTE ] },
];
const scheduleFor = d => {
  let hit = null;
  for(const sc of SCHEDULES) if(ymd(d) >= ymd(sc.from)) hit = sc;
  return hit;
};

// ---------- 기간 한정 반복 일정 (방과후학교 등) ----------
// from~to 사이의 해당 요일에만 자동으로 붙어요. 기수가 끝나면 to 이후로는 안 나옵니다.
const TERMS = [
  { name:'방과후 4기', from:new Date(2026,7,25), to:new Date(2026,9,31),
    summary:'월 창의과학B · 화 공예캘리A · 수 로봇과학A · 금 한자B 1:40~2:20 / 목 배드민턴B 2:30~3:10',
    days:[
      [ ev('창의과학B','after','13:40','14:20','방과후') ], // 월
      [ ev('공예캘리A','after','13:40','14:20','방과후') ], // 화
      [ ev('로봇과학A','after','13:40','14:20','방과후') ], // 수
      [ ev('배드민턴B','after','14:30','15:10','방과후') ], // 목
      [ ev('한자B','after','13:40','14:20','방과후') ],     // 금
    ] },
];

const SEM_START = new Date(2026,7,25); // 8/25(화) 개학 (8/24까지 학교 방학)

// ---------- 지난 시간표 보관 (여름방학 7/27~8/24) ----------
// 개학 전 날짜로 넘기면 그때 시간표를 그대로 볼 수 있어요.
// jump: 줄넘기 특강 있는 요일 인덱스(0=월,2=수,4=금) / gym: 체조 특강(화목) 여부
function vacBase(jump, gym){
  const lunch = ev('점심시간','lunch','12:00','13:00');
  const mwf = (name, dayIdx) => [
    ev(name,'school','9:50','10:30'),
    ...(jump.includes(dayIdx) ? [ev('줄넘기 특강','spec','11:00','11:50')] : []),
    lunch,
  ];
  const tt = name => [

// ---------- 그날만 다른 날 (공휴일·휴강·특강) ----------
// 쓰는 법 — 'YYYY-MM-DD' 에 아래 중 하나를 넣으면 돼요.
//   {holiday:'추석'}                            → 하루 통째로 쉬는 날
//   {drop:['영어학원','태권도']}                 → 정규 일정에서 빼기 (휴강)
//   {add:[ev('현장체험','spec','9:00','15:00')]} → 그날만 추가
//   {events:[ ... ]}                            → 그날 시간표를 통째로 교체
//   {note:'단축수업'}                           → 주간 뷰 아래에 메모 표시
const OVERRIDE = {
  // 개학 첫 주 8/25(화)·8/26(수)는 오후 돌봄 없음
  '2026-08-25': {drop:['돌봄'], note:'오후 돌봄 없어요'},
  '2026-08-26': {drop:['돌봄'], note:'오후 돌봄 없어요'},

  '2026-10-05': {holiday:'개천절 대체공휴일'},
  '2026-10-09': {holiday:'한글날'},
  '2026-12-25': {holiday:'성탄절'},
  '2027-01-01': {holiday:'신정'},
};

const DOW = ['일','월','화','수','목','금','토'];
const key = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const ymd = d => d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
const mondayOf = d => {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return addDays(x, x.getDay()===0 ? -6 : 1-x.getDay());
};

// 날짜 → {type:'day'|'weekend'|'holiday'|'before', ...}
function locate(d){
  const o = OVERRIDE[key(d)];
  const dow = d.getDay();
  if(dow===0 || dow===6) return {type:'weekend'};
  if(o && o.holiday) return {type:'holiday', name:o.holiday, note:o.note};

  // 개학 전 → 보관해 둔 여름방학 시간표
  if(ymd(d) < ymd(SEM_START)){
    const x = VAC_EXTRA[key(d)];
    if(x) return {type:'day', past:true, events:x.events, note:x.note};
    for(const w of VAC_WEEKS){
      const diff = Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - w.start)/86400000);
      if(diff>=0 && diff<=4){
        if(w.holiday && w.holiday[diff]!==undefined)
          return {type:'holiday', name:w.holiday[diff], vacWeek:w, past:true};
        return {type:'day', past:true, vacWeek:w, events:w.days[diff]};
      }
    }
    return {type:'before'};
  }
  const sc = scheduleFor(d);
  let events = sc.week[dow-1];
  for(const t of TERMS){
    if(ymd(d)>=ymd(t.from) && ymd(d)<=ymd(t.to)) events = [...events, ...(t.days[dow-1]||[])];
  }
  if(o){
    if(o.events) events = o.events;
    else {
      if(o.drop) events = events.filter(e => !o.drop.includes(e.n));
      if(o.add)  events = [...events, ...o.add];
    }
  }
  return {type:'day', events, sched:sc, note:o && o.note};
}

// ---------- 주간 뷰 ----------
// 기본은 12시부터(오전은 학교 한 칸뿐). 12시 전에 끝나는 일정이 있는 주는
// 그 일정이 안 보이면 안 되니까 자동으로 더 이른 시각부터 그려요. (방학 시간표 등)
const GBASE = T('12:00'), GEND = T('21:30');
function gridStart(locs){
  const hidden = locs.flatMap(l=>l.events||[]).filter(e=>e.e<=GBASE);
  return hidden.length ? Math.floor(Math.min(...hidden.map(e=>e.s))/60)*60 : GBASE;
}
const PXM = 0.92; // px per minute

function lanes(events){
  // 15분 이상 겹치는 일정만 좌/우 반반 (10분짜리 살짝 겹침은 전체 폭 유지)
  const sorted=[...events].sort((a,b)=>a.s-b.s);
  const out=[];
  sorted.forEach(e=>{
    const clash = out.filter(o=>Math.min(o.e.e,e.e)-Math.max(o.e.s,e.s) >= 15);
    if(!clash.length){ out.push({e, lane:-1}); return; }
    clash.forEach(o=>{ if(o.lane===-1) o.lane=0; });   // 먼저 자리를 확정하고
    const taken = new Set(clash.map(o=>o.lane));       // 비어 있는 쪽으로
    out.push({e, lane: taken.has(0) ? 1 : 0});
  });
  return out;
}

function renderWeek(){
  const today = NOW();
  const fri = addDays(weekStart,4);
  const locs = [0,1,2,3,4].map(i => locate(addDays(weekStart,i)));
  const GSTART = gridStart(locs);
  const hasNow  = locs.some(l => l.type==='day' && !l.past);
  const hasPast = locs.some(l => l.past);

  document.getElementById('weekTitle').textContent =
    (weekStart.getMonth()+1)+'/'+weekStart.getDate()+'(월) ~ '+(fri.getMonth()+1)+'/'+fri.getDate()+'(금)';
  document.getElementById('weekSub').textContent =
    (sameDay(weekStart, mondayOf(today)) ? '이번 주 · ' : '') +
    (hasNow ? '2학기 정규 시간표'
      : hasPast ? '여름방학 시간표' + (ymd(fri) < ymd(today) ? ' (지난 기록)' : '')
      : '시간표가 없는 주');
  document.getElementById('goThisWeek').disabled = sameDay(weekStart, mondayOf(today));

  const head = document.getElementById('gridHead');
  let hh = '<div></div>';
  for(let i=0;i<5;i++){
    const d = addDays(weekStart,i);
    const isT = sameDay(d,today);
    hh += `<div class="dh ${isT?'today':''}">${DOW[d.getDay()]}<small>${d.getMonth()+1}/${d.getDate()}</small></div>`;
  }
  head.innerHTML = hh;

  const H = (GEND-GSTART)*PXM;
  const body = document.getElementById('gridBody');
  // 시간축
  let tcol = `<div class="gtime" style="height:${H}px">`;
  for(let m=GSTART; m<=GEND-30; m+=60){
    tcol += `<span style="top:${(m-GSTART)*PXM}px">${fmt(m)}</span>`;
  }
  tcol += '</div>';

  const notes = [];
  let cols='';
  for(let i=0;i<5;i++){
    const d = addDays(weekStart,i);
    const isT = sameDay(d,today);
    const loc = locs[i];
    const dLabel = (d.getMonth()+1)+'/'+d.getDate()+'('+DOW[d.getDay()]+')';
    let col = `<div class="gcol" style="height:${H}px">`;
    for(let m=GSTART+60; m<GEND; m+=60){
      col += `<div class="hline" style="top:${(m-GSTART)*PXM}px"></div>`;
    }
    if(loc.type==='holiday'){
      col += `<div class="holcol"><span>🎉 ${loc.name} 🎉</span></div>`;
      notes.push(`🎉 ${dLabel} ${loc.name} — 쉬는 날이에요.`);
    } else if(loc.type==='before'){
      col += `<div class="holcol pre"><span>시간표 없음</span></div>`;
    } else {
      if(loc.note) notes.push(`📌 ${dLabel} ${loc.note}`);
      lanes(loc.events||[]).forEach(({e,lane})=>{
        if(e.e<=GSTART) return;
        const col_ = C[e.c];
        const rawTop=(e.s-GSTART)*PXM;
        const top=Math.max(0,rawTop), h=Math.max(20,(e.e-GSTART)*PXM-top-2);
        const clip = rawTop<0 ? ' clip' : '';
        const bd = col_.bd ? `border:1px solid ${col_.bd};` : '';
        const laneCls = lane===-1 ? '' : (lane===0?'lane0':'lane1');
        const short = (e.e-e.s)<=50;
        // 이름이 길면 줄바꿈 대신 글자를 줄여서 아래 시간이 안 잘리게
        const nm = e.n.replace(' 특강','');
        const half = laneCls!=='';
        const fs = half ? (nm.length<=3?9.5:nm.length<=4?8.6:7.8)
                        : (nm.length<=4?10.5:nm.length<=5?9.4:8.6);
        col += `<div class="blk ${laneCls}${clip}" style="top:${top}px;height:${h}px;background:${col_.bg};color:${col_.fg};${bd}">
          <div class="bn" style="font-size:${fs}px">${nm}</div>
          ${e.d&&h>=40?`<div class="bt">${e.d}</div>`:''}
          ${short&&laneCls?'':`<div class="bt">${fmt(e.s)}~${fmt(e.e)}</div>`}
        </div>`;
      });
    }
    // 오늘 현재 시각 라인
    if(isT){
      const nowMin = today.getHours()*60+today.getMinutes();
      if(nowMin>=GSTART && nowMin<=GEND){
        col += `<div class="nowline" style="top:${(nowMin-GSTART)*PXM}px;left:0;right:0"></div>`;
      }
    }
    col += '</div>';
    cols += col;
  }
  body.innerHTML = tcol + cols;

  // 보관된 방학 주차 메모
  const vw = [];
  locs.forEach(l => { if(l.vacWeek && !vw.includes(l.vacWeek)) vw.push(l.vacWeek); });
  vw.forEach(w => {
    notes.push(`🏖️ <b>여름방학 ${w.label}</b> (${w.sub}) — 지난 기록이에요`);
    if(w.note) notes.push(w.note);
  });

  // 이 주에 걸치는 기간 한정 일정(방과후 등)
  TERMS.forEach(t=>{
    const on = [0,1,2,3,4].some(i=>{
      const d = addDays(weekStart,i);
      return ymd(d)>=ymd(t.from) && ymd(d)<=ymd(t.to);
    });
    if(on) notes.push(`🎒 ${t.name} (${t.from.getMonth()+1}/${t.from.getDate()}~${t.to.getMonth()+1}/${t.to.getDate()}): ${t.summary}`);
  });

  // 이 주에 실제로 쓰인 시간표의 안내문만 (주 중간에 바뀌면 둘 다 라벨과 함께)
  const used = [];
  for(let i=0;i<5;i++){
    const sc = scheduleFor(addDays(weekStart,i));
    if(sc && ymd(addDays(weekStart,i))>=ymd(SEM_START) && !used.includes(sc)) used.push(sc);
  }
  if(used.length){
    const sameLen = used.every(sc => sc.notes.length === used[0].notes.length);
    if(used.length===1 || !sameLen){
      used.forEach(sc => sc.notes.forEach(n =>
        notes.push(used.length>1 ? `<b>[${sc.label}]</b> ${n}` : n)));
    } else {
      // 같은 줄은 한 번만, 시기에 따라 달라지는 줄만 라벨을 붙여서
      used[0].notes.forEach((n,i)=>{
        if(used.every(sc => sc.notes[i]===n)) notes.push(n);
        else used.forEach(sc => notes.push(`<b>[${sc.label}]</b> ${sc.notes[i]}`));
      });
    }
  }
  document.getElementById('weekNote').innerHTML = notes.join('<br>');
}

// ---------- 탭/네비 ----------
const $=id=>document.getElementById(id);
$('tabToday').onclick=()=>{ $('tabToday').classList.add('on'); $('tabWeek').classList.remove('on');
  $('viewToday').classList.remove('hidden'); $('viewWeek').classList.add('hidden'); };
$('tabWeek').onclick=()=>{ $('tabWeek').classList.add('on'); $('tabToday').classList.remove('on');
  $('viewWeek').classList.remove('hidden'); $('viewToday').classList.add('hidden'); renderWeek(); };
$('prevDay').onclick=()=>{ curDate=addDays(curDate,-1); renderDay(); };
$('nextDay').onclick=()=>{ curDate=addDays(curDate,1); renderDay(); };
$('goToday').onclick=()=>{ curDate=NOW(); renderDay(); };
$('prevWeek').onclick=()=>{ weekStart=addDays(weekStart,-7); renderWeek(); };
$('nextWeek').onclick=()=>{ weekStart=addDays(weekStart,7); renderWeek(); };
$('goThisWeek').onclick=()=>{ weekStart=mondayOf(NOW()); renderWeek(); };

// 헤더 오늘 표시
(function(){
  const n=NOW();
  const loc=locate(n);
  let extra='';
  if(ymd(n) < ymd(SEM_START))
    extra=' · 개학 D-'+Math.ceil((SEM_START-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/86400000);
  else if(loc.type==='holiday') extra=' · '+loc.name+' 🎉';
  else if(loc.type==='day') extra=' · 2학기';
  $('headToday').textContent='오늘 '+(n.getMonth()+1)+'/'+n.getDate()+' ('+DOW[n.getDay()]+')'+extra;
})();

renderDay();
renderWeek();
if(params.get('tab')==='week') $('tabWeek').onclick();
// 1분마다 지금/다음 갱신
setInterval(()=>{ renderDay(); if(!$('viewWeek').classList.contains('hidden')) renderWeek(); }, 60000);
</script>
